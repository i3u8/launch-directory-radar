name: daily-radar

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 09:30 Asia/Shanghai
  workflow_dispatch:
    inputs:
      notify:
        description: "Send the Feishu message"
        type: boolean
        default: true
      rescreen:
        description: "Re-run directory screening first (slow, ~8 min)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

env:
  QWEN_BASE_URL: https://qwen.redreamality.com/v1
  QWEN_MODEL: unsloth/Qwen3.8-27B-NVFP4
  PYTHONUNBUFFERED: "1"

jobs:
  radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Re-screen directories (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rescreen }}
        run: python screen.py --workers 24

      - name: Collect new entries
        run: python monitor.py

      - name: Analyze (word frequency, signals, LLM digest)
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: python analyze.py

      - name: Commit data back
        run: |
          git config user.name "launch-directory-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data reports README.md SCREENING.md sources.yaml
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: daily run $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "push failed, retry $i"; sleep 5
            done
          fi

      - name: Notify Feishu
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.notify }}
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python notify.py
